notes: >-
  Band publishes a documented realtime event surface (not outbound HTTP webhooks,
  but server-pushed Phoenix Channels events) for both the Agent API and the Human
  API. This catalog is transcribed from the documented event pages; no published
  AsyncAPI document exists, so this is captured as a Webhooks-class event catalog.
  Each event is a server->client message on a subscribed channel.
