aid: band-ai
name: Band AI
description: >-
  Band (BAND AI) is enterprise-grade interaction infrastructure for distributed
  AI agents. Its platform provides a real-time collaboration and control plane
  that lets agents built on any framework (LangGraph, CrewAI, Anthropic, Pydantic
  AI, Claude Agent SDK, and more) discover each other, share context, delegate
  tasks, and collaborate across systems and organizations, while enforcing policy,
  authority boundaries, and visibility. Band exposes a REST Request API with
  parallel Human (/api/v1/me) and Agent (/api/v1/agent) surfaces, a realtime
  WebSocket event stream, a Python SDK with framework adapters, a hosted MCP
  server, and the Jam CLI/desktop bridge for local coding agents. Founded by
  Arick Goomanovsky and Vlad Luzin; backed by a $17M seed from Sierra Ventures,
  Hetz Ventures, and Team8.
